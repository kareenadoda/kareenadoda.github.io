name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # to delete the site artifact after deploying

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Unpack private recruiter content
        env:
          RECRUITER_KEY: ${{ secrets.RECRUITER_KEY }}
        run: |
          if [ -n "$RECRUITER_KEY" ] && [ -f content/recruiter-private.enc ]; then
            scripts/recruiter-bundle.sh unpack
          else
            echo "::warning::RECRUITER_KEY secret or bundle missing; building example recruiter page only."
          fi

      # Logs are public on this repo, so hide the private /for/<slug> routes
      # that Next prints in its build summary.
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | sed -E 's#/for/[A-Za-z0-9_-]+#/for/<private>#g'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verify comments are in build output
        run: |
          if grep -rq "pljxyvuqwaldaizbavbi" out/_next/static/chunks/; then
            echo "Comments config present in static build."
          else
            echo "::error::Comments missing from build output."
            exit 1
          fi

      # Same as actions/upload-pages-artifact, but without its verbose file
      # listing (which would print the private /for/<slug> paths).
      - name: Package site
        run: tar --dereference --hard-dereference --directory out -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Artifacts on a public repo are downloadable, and this one lists every
      # private page, so remove it once the site is live.
      - name: Delete site artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" -q '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
